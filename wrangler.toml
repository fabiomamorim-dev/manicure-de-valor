name = "manicure-de-valor"
main = "worker/index.js"
compatibility_date = "2026-05-01"

[assets]
directory = "./public"
binding = "ASSETS"

# A rota curinga é o que faz cada subdomínio cair no Worker.
# Confira no painel se o registro DNS *.manicuredevalor.com.br existe
# como CNAME proxied (nuvem laranja) antes de publicar.
[[routes]]
pattern = "manicuredevalor.com.br"
custom_domain = true

[[routes]]
pattern = "www.manicuredevalor.com.br"
custom_domain = true

[[routes]]
pattern = "*.manicuredevalor.com.br/*"
zone_name = "manicuredevalor.com.br"

# Banco dos pedidos, usado pelo painel de manutencao. Criado em 10/10/2026, com
# a tabela do db/schema.sql ja rodada.
#
# Falta o segredo que assina os links do painel. Sem ele o site e a gravacao do
# pedido funcionam igual; so o /painel responde 403:
#
#   npx wrangler secret put PAINEL_SEGREDO
#
# ou no painel da Cloudflare, em Workers & Pages > manicure-de-valor >
# Settings > Variables and Secrets > Add > tipo Secret.

[[d1_databases]]
binding = "DB"
database_name = "manicure-de-valor"
database_id = "14c57da4-1eca-4617-a071-e682674e6d0f"

# Limpeza do banco, 3h20 de Brasilia. Tira nome e telefone de pedido com mais
# de um ano e apaga a linha com mais de dois. Com o D1 desligado roda e nao faz
# nada, entao pode ficar ligado desde ja.
[triggers]
crons = ["20 6 * * *"]
